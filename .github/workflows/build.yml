name: Build
on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must be at least the toolchain version in build.gradle.kts, otherwise Gradle has to
        # provision a JDK 21 itself before it can compile anything.
        java: [ 21 ]
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - name: JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Setup Gradle
        # Caches ~/.gradle/caches, which includes the paperweight-userdev artifacts. Worth having:
        # a cold build has to decompile a Paper server before it can compile the plugin.
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
