only-log-play: true
skip-move-packets: true
ignored-packets: []
clear-old-files-days: -1

# Records one connection may hold in memory while waiting to be written. The flush task drains
# everything once a second, so in practice this is the ceiling on records captured per second for
# a single connection. A casual player runs 200-300 packets per second, so this leaves a normal
# connection around 30 seconds of slack if a flush stalls, while still capturing far more than
# enough of a flood to see what is being targeted. 0 or below disables the limit.
max-buffered-records: 10000

# Records ALL connections may hold in memory between them. The per-connection limit above does not
# bound a login flood, because that multiplies it by the number of connections; this one does.
# Roughly 300 casual players' worth of one-second buffers. 0 or below disables the limit.
max-total-buffered-records: 100000

# New logging sessions opened per second. A login flood is a rate problem rather than a concurrency
# one, and sustained logins past this rate are not worth recording - but the permits granted each
# second still give enough coverage to see whether the login path itself is being leaned on.
# 0 or below disables the limit.
max-sessions-per-second: 10

# Sessions that may be opened in one go before that rate starts applying. A restart reconnects
# everybody at once, and those are real players whose logs are wanted.
max-session-burst: 200

# Hard ceiling on sessions in existence at once. Off by default: a session lasts as long as its
# connection, so this is really a cap on concurrent players, and it would silently stop logging
# anyone past the limit on a busy server. The rate limit above is the defence against a flood, and
# max-total-buffered-records is the memory bound. 0 or below disables the limit.
max-sessions: 0
